name: Watch Fable restore

on:
  schedule:
    - cron: '*/5 * * * *'   # 5분 간격 (GitHub 최소값, 지연될 수 있음)
  workflow_dispatch:          # 수동 테스트용

permissions:
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Query Claude status page
        id: s
        run: |
          # status.claude.com 은 Cloudflare 뒤에서 /api 경로를 막아 405를 낸다.
          # Atlassian Statuspage 원본 호스트(status.anthropic.com)의 표준 API를 사용.
          UA="Mozilla/5.0 (compatible; FableWatcher/1.0; +https://github.com/${GITHUB_REPOSITORY})"
          json=$(curl -sSfL -A "$UA" https://status.anthropic.com/api/v2/incidents.json)
          # 이름 또는 업데이트 본문에 Fable/Mythos가 들어간 인시던트 중
          # 가장 최근 것의 status 와 (resolved_at 우선) 시각을 뽑는다.
          read -r status when <<EOF
          $(echo "$json" | jq -r '
            [ .incidents[]
              | select(
                  ((.name // "") | test("Fable|Mythos"; "i"))
                  or any((.incident_updates // [])[]; (.body // "") | test("Fable|Mythos|fable-mythos"; "i"))
                )
            ]
            | sort_by(.updated_at) | reverse | .[0]
            | if . == null then "none -"
              else "\(.status) \(.resolved_at // .updated_at)" end')
          EOF

          echo "detected status: '$status', when: '$when'"

          notify=false
          if [ "$status" = "resolved" ] && [ "$when" != "-" ]; then
            # 방금 풀린 경우만 알림 (cron 지연 대비 30분 윈도우)
            when_epoch=$(date -d "$when" +%s 2>/dev/null || echo 0)
            now=$(date -u +%s)
            age=$(( now - when_epoch ))
            echo "resolved age: ${age}s"
            if [ "$when_epoch" -gt 0 ] && [ "$age" -ge 0 ] && [ "$age" -le 1800 ]; then
              notify=true
            fi
          fi

          echo "notify=$notify" >> "$GITHUB_OUTPUT"
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Notify if just restored
        if: steps.s.outputs.notify == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          open=$(gh issue list --search 'Fable restored in:title state:open' --json number --jq 'length')
          if [ "$open" = "0" ]; then
            # 본인에게 assign + 멘션해서 "participating" 알림(=모바일 푸시)이 확실히 가게 한다.
            gh issue create \
              --title "Fable restored?" \
              --assignee "${{ github.repository_owner }}" \
              --body "@${{ github.repository_owner }} status.anthropic.com의 Fable/Mythos 인시던트가 방금 해제됨 (status: '${{ steps.s.outputs.status }}'). Claude Code에서 /model 확인."
          fi
